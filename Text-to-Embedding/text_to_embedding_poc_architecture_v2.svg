<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#f8fbff"/>
    <stop offset="100%" stop-color="#eef5ff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#8ea5c4" flood-opacity=".22"/>
  </filter>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0 0 L0 6 L9 3 z" fill="#4f84d7"/>
  </marker>
  <style>
    .title{font:700 34px "Aptos","Segoe UI",Arial,sans-serif;fill:#18324d}
    .sub{font:500 16px "Aptos","Segoe UI",Arial,sans-serif;fill:#617b95}
    .lane{fill:#fff;stroke:#d8e4f1;stroke-width:1.5}
    .laneTitle{font:700 14px "Aptos","Segoe UI",Arial,sans-serif;fill:#6a8ab3;letter-spacing:.8px}
    .box{fill:#fff;stroke:#c9daec;stroke-width:1.5;rx:16;filter:url(#shadow)}
    .teal{fill:#f2fbf9;stroke:#bfe3dc}
    .violet{fill:#faf7ff;stroke:#ddd3f5}
    .t{font:650 15px "Aptos","Segoe UI",Arial,sans-serif;fill:#1f3b57}
    .s{font:500 12px "Aptos","Segoe UI",Arial,sans-serif;fill:#70879f}
    .a{stroke:#4f84d7;stroke-width:3;fill:none;marker-end:url(#arr)}
    .d{stroke:#8aa0b8;stroke-width:2;stroke-dasharray:7 7;fill:none}
    .pill{fill:#f7fbff;stroke:#cfdceb;stroke-width:1}
    .pt{font:600 12px "Aptos","Segoe UI",Arial,sans-serif;fill:#55779f}
  </style>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<text x="60" y="62" class="title">Text-to-Embedding PoC — Simplified E2E Architecture</text>
<text x="60" y="92" class="sub">High-level platform view only • internal orchestration and executor call-stack details intentionally hidden</text>

<rect x="48" y="125" width="1504" height="115" rx="22" class="lane"/>
<text x="72" y="155" class="laneTitle">1 — USE CASE / CONSUMER</text>

<rect x="48" y="260" width="1504" height="135" rx="22" class="lane"/>
<text x="72" y="290" class="laneTitle">2 — EXISTING PLATFORM EXECUTION</text>

<rect x="48" y="415" width="1504" height="190" rx="22" class="lane"/>
<text x="72" y="445" class="laneTitle">3 — TEXT-TO-EMBEDDING CAPABILITY</text>

<rect x="48" y="625" width="1504" height="125" rx="22" class="lane"/>
<text x="72" y="655" class="laneTitle">4 — RESPONSE</text>

<rect x="48" y="770" width="1504" height="80" rx="22" class="lane"/>
<text x="72" y="800" class="laneTitle">5 — CROSS-CUTTING</text>

<rect x="135" y="168" width="250" height="54" class="box"/>
<text x="260" y="193" text-anchor="middle" class="t">Use Case Caller</text>
<text x="260" y="212" text-anchor="middle" class="s">text / address / company</text>

<rect x="510" y="168" width="300" height="54" class="box teal"/>
<text x="660" y="193" text-anchor="middle" class="t">Use Case Configuration</text>
<text x="660" y="212" text-anchor="middle" class="s">model • dimension • policies</text>

<rect x="945" y="168" width="300" height="54" class="box violet"/>
<text x="1095" y="193" text-anchor="middle" class="t">Optional /v1/embeddings Facade</text>
<text x="1095" y="212" text-anchor="middle" class="s">compatibility adapter only</text>

<path d="M385 195 L495 195" class="a"/>
<path d="M810 195 L930 195" class="d"/>
<path d="M260 222 L260 325 L330 325" class="a"/>

<rect x="330" y="305" width="360" height="65" class="box"/>
<text x="510" y="332" text-anchor="middle" class="t">Orchestration Sync API</text>
<text x="510" y="352" text-anchor="middle" class="s">generic auth • config • guardrail • timeout • dispatch</text>

<rect x="910" y="305" width="360" height="65" class="box teal"/>
<text x="1090" y="332" text-anchor="middle" class="t">Executor / Sync Runtime</text>
<text x="1090" y="352" text-anchor="middle" class="s">runs the use-case step and returns the result</text>

<path d="M690 337 L895 337" class="a"/>
<path d="M1090 370 L1090 490 L1180 490" class="a"/>

<rect x="140" y="475" width="265" height="88" class="box violet"/>
<text x="272" y="505" text-anchor="middle" class="t">Text-to-Embedding Agent</text>
<text x="272" y="528" text-anchor="middle" class="s">thin deterministic wrapper</text>
<text x="272" y="547" text-anchor="middle" class="s">invokes reusable tool</text>

<rect x="480" y="475" width="270" height="88" class="box teal"/>
<text x="615" y="505" text-anchor="middle" class="t">Embedding Tool</text>
<text x="615" y="528" text-anchor="middle" class="s">validate • normalize • batch</text>
<text x="615" y="547" text-anchor="middle" class="s">reconstruct results</text>

<rect x="825" y="475" width="245" height="88" class="box teal"/>
<text x="947" y="505" text-anchor="middle" class="t">Address Parser</text>
<text x="947" y="528" text-anchor="middle" class="s">only when is_address=true</text>
<text x="947" y="547" text-anchor="middle" class="s">street • city • postcode • country</text>

<rect x="1145" y="475" width="225" height="88" class="box"/>
<text x="1257" y="505" text-anchor="middle" class="t">Model Adapter</text>
<text x="1257" y="528" text-anchor="middle" class="s">provider-neutral</text>
<text x="1257" y="547" text-anchor="middle" class="s">approved model access</text>

<rect x="1410" y="475" width="125" height="88" class="box violet"/>
<text x="1472" y="505" text-anchor="middle" class="t">Embedding</text>
<text x="1472" y="528" text-anchor="middle" class="t">Model</text>
<text x="1472" y="547" text-anchor="middle" class="s">vectors</text>

<path d="M405 519 L465 519" class="a"/>
<path d="M750 519 L810 519" class="a"/>
<path d="M1070 519 L1130 519" class="a"/>
<path d="M1370 519 L1395 519" class="a"/>

<rect x="455" y="672" width="690" height="56" class="box"/>
<text x="800" y="698" text-anchor="middle" class="t">Structured Sync Response</text>
<text x="800" y="718" text-anchor="middle" class="s">full vector • address component vectors where applicable • model/dimension metadata</text>

<path d="M1472 563 L1472 595 L800 595 L800 657" class="d"/>

<rect x="165" y="806" width="260" height="30" rx="13" class="pill"/>
<text x="295" y="826" text-anchor="middle" class="pt">Correlation + Audit + Tracing</text>
<rect x="510" y="806" width="210" height="30" rx="13" class="pill"/>
<text x="615" y="826" text-anchor="middle" class="pt">Timeout + Limits</text>
<rect x="805" y="806" width="250" height="30" rx="13" class="pill"/>
<text x="930" y="826" text-anchor="middle" class="pt">No Embedding Persistence</text>
<rect x="1140" y="806" width="245" height="30" rx="13" class="pill"/>
<text x="1262" y="826" text-anchor="middle" class="pt">Safe Logging + Metrics</text>
</svg>