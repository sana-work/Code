<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1470" viewBox="0 0 2560 1470"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#527684"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="80" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#17333d">Generic Request Processing Workflow</text><text x="80" y="120" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#4d6771">A validated request follows either a deterministic function path or an agentic reasoning path.</text><path d="M80 148 H2480" stroke="#d7e2e6" stroke-width="2"/><rect x="100" y="230" width="420" height="150" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="310" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">INPUT</text><text x="310" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Receive request</text><text x="310" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Text + request type</text><rect x="650" y="230" width="520" height="150" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="910" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">DETERMINISTIC NODE</text><text x="910" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Validate and normalize</text><text x="910" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Check input schema and limits</text><polygon points="1510,195 1720,305 1510,415 1300,305" fill="#fff4d7" stroke="#c8a04a" stroke-width="2"/><text x="1510" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17333d">Choose path</text><text x="1510" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#896014">DECISION NODE</text><path d="M520,305 L650,305" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1170,305 L1300,305" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="820" y="620" width="620" height="190" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="1130" y="651" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">DETERMINISTIC NODE</text><text x="1130" y="692" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Run fixed application logic</text><text x="1130" y="730" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Example: count words, validate fields</text><text x="1130" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">or perform a registered calculation</text><rect x="1690" y="620" width="620" height="190" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="2000" y="651" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">AGENTIC NODE</text><text x="2000" y="692" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Run the selected agent</text><text x="2000" y="730" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Approved model + instructions + tools</text><text x="2000" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Return a structured answer</text><path d="M1510,415 L1510,500 L1130,500 L1130,620" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1150" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">RULE_BASED</text><path d="M1510,500 L2000,500 L2000,620" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1950" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">REASONING</text><circle cx="1510" cy="500" r="5" fill="#527684"/><rect x="1260" y="1040" width="680" height="190" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="1600" y="1071" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">DETERMINISTIC NODE</text><text x="1600" y="1112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Validate and format output</text><text x="1600" y="1150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">One response contract for either path</text><text x="1600" y="1182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Only the selected branch runs</text><rect x="2050" y="1060" width="400" height="150" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="2250" y="1091" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">OUTPUT</text><text x="2250" y="1132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Return response</text><text x="2250" y="1170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Complete this workflow</text><path d="M1130,810 L1130,940 L1600,940 L1600,985" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  /><path d="M2000,810 L2000,985 L1600,985" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  /><circle cx="1600" cy="985" r="5" fill="#527684"/><path d="M1600,985 L1600,1040" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1940,1135 L2050,1135" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1600" y="907" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Exclusive merge: one branch supplies the result</text><rect x="100" y="1300" width="650" height="110" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="425" y="1331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">DETERMINISTIC</text><text x="425" y="1372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Code owns the operation</text><rect x="840" y="1300" width="650" height="110" rx="8" fill="#fff4d7" stroke="#c8a04a" stroke-width="2"/><text x="1165" y="1331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#896014">DECISION</text><text x="1165" y="1372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Typed facts select a named route</text><rect x="1580" y="1300" width="870" height="110" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="2015" y="1331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">AGENTIC</text><text x="2015" y="1372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">A model reasons within the node contract</text></svg>