<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1490" viewBox="0 0 2800 1490"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#527684"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="80" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#17333d">Mixed Workflow | Agent Followed by Exact Data Composition</text><text x="80" y="120" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#4d6771">The agent writes the explanation. Application code preserves the original tool block and adds it at final delivery.</text><path d="M80 148 H2720" stroke="#d7e2e6" stroke-width="2"/><rect x="48" y="180" width="2704" height="340" rx="8" fill="#f8fafb"/><text x="80" y="213" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">01  WORKFLOW INSIDE THE EXECUTOR</text><rect x="80" y="260" width="340" height="190" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="250" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">INPUT</text><text x="250" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Request</text><text x="250" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Get a report</text><text x="250" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">and show the results</text><rect x="520" y="260" width="500" height="190" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="770" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">DETERMINISTIC NODE</text><text x="770" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Fetch tool data</text><text x="770" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Store the original output</text><text x="770" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Return status + row count</text><rect x="1160" y="260" width="500" height="190" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="1410" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">AGENTIC NODE</text><text x="1410" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Write explanation</text><text x="1410" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Uses the question and small facts</text><text x="1410" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Original rows are not provided</text><rect x="1800" y="260" width="660" height="190" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2130" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">DETERMINISTIC NODE</text><text x="2130" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Append-original response step</text><text x="2130" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Choose layout and bind the original output</text><text x="2130" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Emit a small response manifest</text><path d="M420,355 L520,355" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1020,355 L1160,355" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1090" y="327" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Safe facts</text><path d="M1660,355 L1800,355" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="48" y="690" width="2704" height="340" rx="8" fill="#f8fafb"/><text x="80" y="723" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">02  SEPARATE DATA AND PRESENTATION PATHS</text><rect x="520" y="760" width="500" height="200" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="770" y="791" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">SERVER-SIDE ORIGINAL OUTPUT</text><text x="770" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Preserve tool bytes</text><text x="770" y="870" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Original block + checksum</text><text x="770" y="902" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Not model-visible session data</text><rect x="1800" y="760" width="660" height="200" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="2130" y="791" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">RESPONSE MANIFEST</text><text x="2130" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Explanation + original reference</text><text x="2130" y="870" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">The private reference identifies the data</text><text x="2130" y="902" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">The graph does not copy raw rows into output</text><path d="M770,450 L770,760" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="960" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Original tool data</text><path d="M2130,450 L2130,760" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="2420" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Explanation + reference</text><path d="M1020,860 L1800,860" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="1410" y="837" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Server-only reference</text><rect x="48" y="1120" width="2704" height="320" rx="8" fill="#f8fafb"/><text x="80" y="1153" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">03  FINAL DELIVERY AFTER ALL MODEL STAGES</text><rect x="1800" y="1180" width="660" height="200" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2130" y="1211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">ORCHESTRATOR / DELIVERY</text><text x="2130" y="1252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Assemble and send response</text><text x="2130" y="1290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Explanation + unchanged original tool data</text><text x="2130" y="1322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Copy the original block without model rewriting</text><rect x="2540" y="1190" width="180" height="180" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="2630" y="1262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Client</text><text x="2630" y="1300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Final</text><text x="2630" y="1332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">response</text><path d="M2130,960 L2130,1180" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="2420" y="1080" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Apply deterministic finalizer</text><path d="M770,960 L770,1280 L1800,1280" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="1285" y="1253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Load and verify original bytes</text><path d="M2460,1280 L2540,1280" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="420" y="1390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Private output-store adapter must be durable across workers and restarts.</text></svg>