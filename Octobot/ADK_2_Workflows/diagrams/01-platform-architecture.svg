<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1540" viewBox="0 0 2560 1540"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#527684"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="80" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#17333d">Workflow Platform Architecture</text><text x="80" y="120" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#4d6771">Existing API and transport paths dispatch one workflow; ADK owns the internal nodes and edges.</text><path d="M80 148 H2480" stroke="#d7e2e6" stroke-width="2"/><rect x="48" y="180" width="2464" height="240" rx="8" fill="#f8fafb"/><text x="80" y="213" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">01  REQUEST AND PLANNING</text><rect x="80" y="240" width="350" height="150" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="255" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">CLIENT</text><text x="255" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Send request</text><text x="255" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Task or conversation</text><rect x="530" y="240" width="450" height="150" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="755" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">ORCHESTRATOR</text><text x="755" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Validate request</text><text x="755" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Identity + configuration</text><rect x="1080" y="240" width="540" height="150" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="1350" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">ORCHESTRATOR</text><text x="1350" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Create outer plan</text><text x="1350" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Select agent or workflow version</text><rect x="1720" y="240" width="740" height="150" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2090" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">ORCHESTRATOR</text><text x="2090" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Choose execution path</text><text x="2090" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">ASYNC, SYNC or HYBRID</text><path d="M430,315 L530,315" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M980,315 L1080,315" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1620,315 L1720,315" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="48" y="510" width="2464" height="250" rx="8" fill="#f8fafb"/><text x="80" y="543" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">02  TRANSPORT</text><rect x="800" y="575" width="600" height="150" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="1100" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">DIRECT HTTP</text><text x="1100" y="647" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Sync coordinator</text><text x="1100" y="685" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">SYNC + background HYBRID</text><rect x="1600" y="575" width="600" height="150" rx="8" fill="#f8ecdf" stroke="#c89c6b" stroke-width="2"/><text x="1900" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8a5e30">KAFKA</text><text x="1900" y="647" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Queued execution</text><text x="1900" y="685" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">ASYNC dispatch</text><path d="M2090,390 L2090,465 L1100,465 L1100,575" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1210" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">SYNC / HYBRID</text><path d="M1900,465 L1900,575" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="2010" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">ASYNC</text><circle cx="1900" cy="465" r="5" fill="#527684"/><rect x="48" y="875" width="2464" height="300" rx="8" fill="#f8fafb"/><text x="80" y="908" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">03  EXECUTION</text><rect x="80" y="950" width="440" height="180" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="300" y="981" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">EXECUTOR</text><text x="300" y="1022" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Resolve executable</text><text x="300" y="1060" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Load pinned definition</text><text x="300" y="1092" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Compile native workflow</text><rect x="620" y="950" width="660" height="180" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="950" y="981" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">NATIVE ADK RUNTIME</text><text x="950" y="1022" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Execute workflow</text><text x="950" y="1060" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Agentic + deterministic + decision nodes</text><text x="950" y="1092" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">ADK follows the configured edges</text><rect x="1380" y="950" width="520" height="180" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="1640" y="981" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">ORCHESTRATOR</text><text x="1640" y="1022" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Build final response</text><text x="1640" y="1060" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Use the root workflow output</text><text x="1640" y="1092" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Advance the outer step once</text><rect x="2000" y="950" width="460" height="180" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="2230" y="981" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">CLIENT DELIVERY</text><text x="2230" y="1022" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Receive result</text><text x="2230" y="1060" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">HTTP, configured result channel</text><text x="2230" y="1092" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">or connected SSE</text><path d="M1100,725 L1100,800 L300,800 L300,855" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  /><path d="M1900,725 L1900,855 L300,855" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  /><text x="1260" y="836" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Common Executor execution adapter</text><circle cx="300" cy="855" r="5" fill="#527684"/><path d="M300,855 L300,950" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M520,1040 L620,1040" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1280,1040 L1380,1040" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1900,1040 L2000,1040" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="48" y="1230" width="2464" height="235" rx="8" fill="#ffffff"/><text x="80" y="1263" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">04  PERSISTENCE</text><rect x="80" y="1300" width="440" height="140" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="300" y="1331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">VERSIONED CONFIG</text><text x="300" y="1372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Workflow definitions</text><text x="300" y="1410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Nodes, edges and dependencies</text><rect x="620" y="1300" width="660" height="140" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="950" y="1331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">EXECUTOR PERSISTENCE</text><text x="950" y="1372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">ADK sessions and checkpoints</text><text x="950" y="1410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Saved native execution state</text><rect x="1380" y="1300" width="520" height="140" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="1640" y="1331" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">ORCHESTRATOR PERSISTENCE</text><text x="1640" y="1372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Task runtime and results</text><text x="1640" y="1410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Outer plan, status and run references</text><path d="M300,1300 L300,1130" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="400" y="1210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Load</text><path d="M950,1130 L950,1300" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="1070" y="1210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Checkpoint</text><path d="M1640,1130 L1640,1300" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="1770" y="1210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Persist status</text><text x="2230" y="1330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Solid arrows: execution / delivery</text><text x="2230" y="1375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Dashed arrows: persistence access</text></svg>