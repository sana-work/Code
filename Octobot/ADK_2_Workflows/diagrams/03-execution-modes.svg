<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1710" viewBox="0 0 2560 1710"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#527684"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="80" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#17333d">Execution Modes | One Workflow Runtime</text><text x="80" y="120" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#4d6771">Read each column from top to bottom. Transport changes; the native ADK workflow stays the same.</text><path d="M80 148 H2480" stroke="#d7e2e6" stroke-width="2"/><rect x="80" y="185" width="740" height="1230" rx="8" fill="#fbfcfd" stroke="#8aa8cf" stroke-width="2"/><rect x="80" y="185" width="740" height="110" rx="8" fill="#e8f0fb"/><text x="450" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#315e91">SYNC</text><text x="450" y="269" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">The client waits for completion</text><rect x="120" y="330" width="660" height="150" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="450" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">CLIENT</text><text x="450" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Submit request</text><text x="450" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Call the sync task API</text><path d="M450,480 L450,545" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="120" y="545" width="660" height="150" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="450" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">ORCHESTRATOR</text><text x="450" y="617" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Validate and create plan</text><text x="450" y="655" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Save the outer runtime</text><path d="M450,695 L450,760" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="120" y="760" width="660" height="150" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="450" y="791" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">DIRECT HTTP</text><text x="450" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Dispatch executable</text><text x="450" y="870" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Sync coordinator calls Executor</text><path d="M450,910 L450,975" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="120" y="975" width="660" height="150" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="450" y="1006" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">EXECUTOR</text><text x="450" y="1047" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Run native ADK workflow</text><text x="450" y="1085" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Nodes and edges execute internally</text><path d="M450,1125 L450,1190" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="120" y="1190" width="660" height="150" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="450" y="1221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">ORCHESTRATOR -&gt; CLIENT</text><text x="450" y="1262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Return final response</text><text x="450" y="1300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Complete the original HTTP request</text><rect x="910" y="185" width="740" height="1230" rx="8" fill="#fbfcfd" stroke="#c89c6b" stroke-width="2"/><rect x="910" y="185" width="740" height="110" rx="8" fill="#f8ecdf"/><text x="1280" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#8a5e30">ASYNC / KAFKA</text><text x="1280" y="269" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">The client receives a result later</text><rect x="950" y="330" width="660" height="150" rx="8" fill="#f8ecdf" stroke="#c89c6b" stroke-width="2"/><text x="1280" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8a5e30">CLIENT</text><text x="1280" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Submit request</text><text x="1280" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Call the async task API</text><path d="M1280,480 L1280,545" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="950" y="545" width="660" height="150" rx="8" fill="#f8ecdf" stroke="#c89c6b" stroke-width="2"/><text x="1280" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8a5e30">ORCHESTRATOR</text><text x="1280" y="617" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Validate, plan and acknowledge</text><text x="1280" y="655" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Persist accepted work before dispatch</text><path d="M1280,695 L1280,760" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="950" y="760" width="660" height="150" rx="8" fill="#f8ecdf" stroke="#c89c6b" stroke-width="2"/><text x="1280" y="791" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8a5e30">KAFKA</text><text x="1280" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Deliver work to a consumer</text><text x="1280" y="870" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Deduplicate and acquire run ownership</text><path d="M1280,910 L1280,975" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="950" y="975" width="660" height="150" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="1280" y="1006" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">EXECUTOR</text><text x="1280" y="1047" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Run native ADK workflow</text><text x="1280" y="1085" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Nodes and edges execute internally</text><path d="M1280,1125 L1280,1190" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="950" y="1190" width="660" height="150" rx="8" fill="#f8ecdf" stroke="#c89c6b" stroke-width="2"/><text x="1280" y="1221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8a5e30">KAFKA -&gt; ORCHESTRATOR</text><text x="1280" y="1262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Deliver persisted root outcome</text><text x="1280" y="1300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Build response and deliver to client</text><rect x="1740" y="185" width="740" height="1230" rx="8" fill="#fbfcfd" stroke="#72ad99" stroke-width="2"/><rect x="1740" y="185" width="740" height="110" rx="8" fill="#e6f4ee"/><text x="2110" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f6d58">HYBRID</text><text x="2110" y="269" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Early acknowledgement, background execution</text><rect x="1780" y="330" width="660" height="150" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2110" y="361" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">CLIENT</text><text x="2110" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Submit request</text><text x="2110" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Select a HYBRID-configured use case</text><path d="M2110,480 L2110,545" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1780" y="545" width="660" height="150" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2110" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">ORCHESTRATOR</text><text x="2110" y="617" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Validate, plan and acknowledge</text><text x="2110" y="655" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Persist accepted background work</text><path d="M2110,695 L2110,760" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1780" y="760" width="660" height="150" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2110" y="791" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">BACKGROUND DIRECT HTTP</text><text x="2110" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Dispatch executable</text><text x="2110" y="870" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Background coordinator calls Executor</text><path d="M2110,910 L2110,975" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1780" y="975" width="660" height="150" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="2110" y="1006" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">EXECUTOR</text><text x="2110" y="1047" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Run native ADK workflow</text><text x="2110" y="1085" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Nodes and edges execute internally</text><path d="M2110,1125 L2110,1190" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1780" y="1190" width="660" height="150" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2110" y="1221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">ORCHESTRATOR -&gt; CLIENT</text><text x="2110" y="1262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Deliver final response</text><text x="2110" y="1300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Use the configured delivery channel</text><rect x="80" y="1480" width="2400" height="160" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="1280" y="1511" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">OPTIONAL DELIVERY STYLE</text><text x="1280" y="1552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">STREAM / SSE</text><text x="1280" y="1590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Send selected progress events while the configured mode executes. Streaming does not create a fourth execution mode.</text></svg>