<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1440" viewBox="0 0 2800 1440"><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 Z" fill="#527684"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="80" y="75" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#17333d">Visual Workflow Builder | From Canvas to ADK Execution</text><text x="80" y="120" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#4d6771">Users connect registered capabilities. The backend validates and compiles the saved definition into a native workflow.</text><path d="M80 148 H2720" stroke="#d7e2e6" stroke-width="2"/><rect x="48" y="180" width="2704" height="340" rx="8" fill="#f8fafb"/><text x="80" y="213" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">01  WORKFLOW AUTHORING</text><rect x="80" y="260" width="540" height="190" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="350" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">NODE CATALOGUE</text><text x="350" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Pick a capability</text><text x="350" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Registered tool, function, agent,</text><text x="350" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">decision or response composer</text><rect x="760" y="260" width="600" height="190" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="1060" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">CANVAS</text><text x="1060" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Drop nodes and connect edges</text><text x="1060" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Choose the order of operations</text><text x="1060" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Label decision routes</text><rect x="1500" y="260" width="600" height="190" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="1800" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">PROPERTIES</text><text x="1800" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Map typed inputs and outputs</text><text x="1800" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Choose agent/tool settings</text><text x="1800" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Keep original data server-only</text><rect x="2240" y="260" width="480" height="190" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="2480" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">DRAFT</text><text x="2480" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Save the design</text><text x="2480" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Graph + data bindings</text><text x="2480" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Layout saved separately</text><path d="M620,355 L760,355" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1360,355 L1500,355" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M2100,355 L2240,355" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1000" y="700" width="600" height="180" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="1300" y="731" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">SAVED APPLICATION DEFINITION</text><text x="1300" y="772" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Versioned graph JSON</text><text x="1300" y="810" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Executable IDs, edges and bindings</text><rect x="2240" y="700" width="480" height="180" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2480" y="731" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">SERVER VALIDATION</text><text x="2480" y="772" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Validate and publish</text><text x="2480" y="810" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Check schemas and permitted nodes</text><text x="2480" y="842" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Freeze version + dependencies</text><path d="M2480,450 L2480,600 L1300,600 L1300,700" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1870" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Saved design, not executable browser code</text><path d="M1600,790 L2240,790" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1920" y="767" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Validate / test / publish</text><rect x="48" y="1090" width="2704" height="280" rx="8" fill="#f8fafb"/><text x="80" y="1123" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4d6771">02  EXECUTION</text><rect x="80" y="1160" width="700" height="190" rx="8" fill="#f3f7f8" stroke="#a1b6bf" stroke-width="2"/><text x="430" y="1191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#365761">EXISTING ORCHESTRATOR API</text><text x="430" y="1232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Select workflow for the request</text><text x="430" y="1270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Use-case configuration selects a published version</text><text x="430" y="1302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Keep SYNC / ASYNC / HYBRID transport</text><rect x="950" y="1160" width="740" height="190" rx="8" fill="#e8f0fb" stroke="#8aa8cf" stroke-width="2"/><text x="1320" y="1191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#315e91">EXECUTOR COMPILER</text><text x="1320" y="1232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Build native ADK nodes and edges</text><text x="1320" y="1270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Resolve registered implementations and data bindings</text><text x="1320" y="1302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">ADK owns internal traversal</text><rect x="1810" y="1160" width="910" height="190" rx="8" fill="#e6f4ee" stroke="#72ad99" stroke-width="2"/><text x="2265" y="1191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f6d58">NATIVE WORKFLOW + FINAL DELIVERY</text><text x="2265" y="1232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17333d">Tool -&gt; Agent -&gt; Deterministic Composer</text><text x="2265" y="1270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Run the graph and apply its final response policy</text><text x="2265" y="1302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#4d6771">Deliver explanation plus the unchanged original data</text><path d="M2480,880 L2480,1000 L430,1000 L430,1160" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1620" y="977" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#4d6771">Normal task requests select a published version</text><path d="M780,1255 L950,1255" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1690,1255 L1810,1255" fill="none" stroke="#527684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/></svg>