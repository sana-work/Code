<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">Octobot current Asset Services architecture</title>
  <desc id="desc">Current three-agent flow with two Asset Services MCP tools, code-defined contracts, a shared provider runtime, and Transaction Management marked as a future extension.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="future-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .page-title { font: 700 36px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .lane-note { font: 500 15px Inter, "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .card-title { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .card-body { font: 400 15px Inter, "Segoe UI", Arial, sans-serif; fill: #334155; }
      .card-small { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .arrow-label { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .chip { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .footer { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#f8fafc"/>

  <text x="70" y="64" class="page-title">Octobot Current Architecture</text>
  <text x="70" y="100" class="subtitle">Asset Services active now; Transaction Management is an unregistered future extension</text>

  <rect x="1328" y="35" width="180" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1418" y="58" text-anchor="middle" class="chip" fill="#1d4ed8">AS CURRENT</text>
  <rect x="1522" y="35" width="150" height="36" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1597" y="58" text-anchor="middle" class="chip" fill="#166534">2 MCP TOOLS</text>
  <rect x="1686" y="35" width="164" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1768" y="58" text-anchor="middle" class="chip" fill="#92400e">LIMIT 100</text>

  <!-- Agent executor lane -->
  <rect x="60" y="135" width="1800" height="350" rx="8" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="90" y="176" class="lane-title">1. Agent executor path</text>
  <text x="352" y="176" class="lane-note">All handoffs are JSON objects containing JSON-native values only</text>

  <rect x="90" y="245" width="170" height="112" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="175" cy="278" r="17" fill="#e2e8f0"/>
  <circle cx="175" cy="273" r="6" fill="#475569"/>
  <path d="M160 294 Q175 282 190 294" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <text x="175" y="326" text-anchor="middle" class="card-title">User</text>
  <text x="175" y="347" text-anchor="middle" class="card-small">Business request</text>

  <rect x="330" y="215" width="300" height="172" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <rect x="330" y="215" width="300" height="9" rx="4" fill="#2563eb"/>
  <text x="480" y="255" text-anchor="middle" class="card-title">Root Orchestrator</text>
  <text x="480" y="283" text-anchor="middle" class="card-body">Classifies business intent</text>
  <text x="480" y="307" text-anchor="middle" class="card-body">Preserves identifiers exactly</text>
  <text x="480" y="331" text-anchor="middle" class="card-body">Calls no data tools</text>
  <rect x="399" y="346" width="162" height="27" rx="6" fill="#dbeafe"/>
  <text x="480" y="365" text-anchor="middle" class="mono">root_handoff</text>

  <rect x="735" y="215" width="330" height="172" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
  <rect x="735" y="215" width="330" height="9" rx="4" fill="#0f766e"/>
  <text x="900" y="255" text-anchor="middle" class="card-title">AS Specialist</text>
  <text x="900" y="283" text-anchor="middle" class="card-body">Chooses Events, Cash, or both</text>
  <text x="900" y="307" text-anchor="middle" class="card-body">Uses live typed tool schemas</text>
  <text x="900" y="331" text-anchor="middle" class="card-body">No joins or agent-layer retries</text>
  <rect x="805" y="346" width="190" height="27" rx="6" fill="#ccfbf1"/>
  <text x="900" y="365" text-anchor="middle" class="mono">asset_services_result</text>

  <rect x="1180" y="215" width="310" height="172" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1180" y="215" width="310" height="9" rx="4" fill="#c2410c"/>
  <text x="1335" y="255" text-anchor="middle" class="card-title">Final Formatter</text>
  <text x="1335" y="283" text-anchor="middle" class="card-body">Calls no tools</text>
  <text x="1335" y="307" text-anchor="middle" class="card-body">HTML-free answer and tables</text>
  <text x="1335" y="331" text-anchor="middle" class="card-body">Preserves nulls and partial data</text>
  <rect x="1283" y="346" width="104" height="27" rx="6" fill="#ffedd5"/>
  <text x="1335" y="365" text-anchor="middle" class="mono">schema</text>

  <rect x="1605" y="245" width="215" height="112" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1713" y="292" text-anchor="middle" class="card-title">UI</text>
  <text x="1713" y="324" text-anchor="middle" class="card-small">Plain text + tables</text>

  <line x1="260" y1="301" x2="319" y2="301" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="630" y1="301" x2="724" y2="301" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="677" y="287" text-anchor="middle" class="arrow-label">AS route</text>
  <line x1="1065" y1="301" x2="1169" y2="301" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1490" y1="301" x2="1594" y2="301" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M480 387 L480 441 L1335 441 L1335 398" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="684" y="420" width="450" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="909" y="440" text-anchor="middle" class="card-small">Direct / clarification / unavailable domain / out of scope</text>

  <!-- MCP lane -->
  <rect x="60" y="515" width="1800" height="420" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="90" y="557" class="lane-title">2. Asset Services MCP server</text>
  <text x="431" y="557" class="lane-note">Business-facing typed tools outside; provider-specific details inside</text>

  <rect x="95" y="615" width="345" height="182" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
  <text x="268" y="650" text-anchor="middle" class="card-title">Typed tool wrappers</text>
  <text x="268" y="678" text-anchor="middle" class="mono">asset_services_tools.py</text>
  <text x="268" y="711" text-anchor="middle" class="card-small">query_as_events_entitlements</text>
  <text x="268" y="736" text-anchor="middle" class="card-small">query_as_cash_entitlements</text>
  <rect x="163" y="755" width="210" height="27" rx="6" fill="#ccfbf1"/>
  <text x="268" y="774" text-anchor="middle" class="chip" fill="#115e59">EXACTLY TWO TOOLS</text>

  <rect x="565" y="615" width="365" height="182" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="748" y="650" text-anchor="middle" class="card-title">Shared service runtime</text>
  <text x="748" y="678" text-anchor="middle" class="mono">service_tool_runtime.py</text>
  <text x="748" y="711" text-anchor="middle" class="card-small">Validate inputs and output selection</text>
  <text x="748" y="736" text-anchor="middle" class="card-small">Build typed equality filters</text>
  <text x="748" y="761" text-anchor="middle" class="card-small">Normalize records and safe errors</text>

  <rect x="1055" y="615" width="350" height="182" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="3" filter="url(#shadow)"/>
  <text x="1230" y="650" text-anchor="middle" class="card-title">Provider query service</text>
  <text x="1230" y="678" text-anchor="middle" class="mono">provider_query_service.py</text>
  <text x="1230" y="711" text-anchor="middle" class="card-small">ProviderQueryRequest + FilterExpression</text>
  <text x="1230" y="736" text-anchor="middle" class="card-small">HTTP timeout and bounded retries</text>
  <text x="1230" y="761" text-anchor="middle" class="card-small">One configured total deadline</text>

  <rect x="1540" y="635" width="265" height="142" rx="8" fill="#ffffff" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <text x="1673" y="679" text-anchor="middle" class="card-title">Provider REST API</text>
  <text x="1673" y="710" text-anchor="middle" class="card-small">External service</text>
  <text x="1673" y="735" text-anchor="middle" class="card-small">Deployment-owned access</text>

  <line x1="440" y1="706" x2="554" y2="706" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="497" y="690" text-anchor="middle" class="arrow-label">contract + args</text>
  <line x1="930" y1="706" x2="1044" y2="706" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="987" y="690" text-anchor="middle" class="arrow-label">typed request</text>
  <line x1="1405" y1="706" x2="1529" y2="706" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1467" y="690" text-anchor="middle" class="arrow-label">HTTPS</text>

  <rect x="95" y="838" width="510" height="70" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="350" y="866" text-anchor="middle" class="mono">contracts/asset_services.py</text>
  <text x="350" y="891" text-anchor="middle" class="card-small">Single AS source: inputs, 38/121 output maps, defaults, aliases, limits</text>

  <rect x="640" y="838" width="395" height="70" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="838" y="866" text-anchor="middle" class="mono">contracts/common.py + registry</text>
  <text x="838" y="891" text-anchor="middle" class="card-small">Immutable contract types and fail-fast validation</text>

  <rect x="1070" y="838" width="735" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1438" y="866" text-anchor="middle" class="mono">RequestContext + environment config + log redaction</text>
  <text x="1438" y="891" text-anchor="middle" class="card-small">Correlation ID, deadline, auth, certificates, provider URL, safe diagnostics</text>

  <path d="M350 838 L350 817 L650 817 L650 797" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M838 838 L838 808" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1438 838 L1438 817 L1230 817 L1230 797" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Future extension lane -->
  <rect x="60" y="965" width="1800" height="160" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="90" y="1004" class="lane-title">3. Future extension boundary</text>

  <rect x="90" y="1023" width="505" height="75" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="343" y="1053" text-anchor="middle" class="card-title" fill="#475569">Transaction Management</text>
  <text x="343" y="1081" text-anchor="middle" class="card-body">No TM specialist or TM MCP tools are registered today</text>

  <path d="M595 1060 L748 1060 L748 808" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#future-arrow)"/>
  <text x="671" y="1043" text-anchor="middle" class="card-small">reuse later</text>

  <rect x="825" y="1023" width="450" height="75" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="1050" y="1053" text-anchor="middle" class="card-title">Current exclusions</text>
  <text x="1050" y="1081" text-anchor="middle" class="card-body">No generic tools, metadata DB, or mapping generator</text>

  <rect x="1310" y="1023" width="510" height="75" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1565" y="1053" text-anchor="middle" class="card-title">End-to-end guarantees</text>
  <text x="1565" y="1081" text-anchor="middle" class="card-body">Exact IDs, safe errors, partial data, HTML-free final schema</text>

  <line x1="70" y1="1160" x2="105" y2="1160" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="120" y="1165" class="footer">Current active flow</text>
  <line x1="285" y1="1160" x2="320" y2="1160" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#future-arrow)"/>
  <text x="335" y="1165" class="footer">Future-only relationship</text>
  <text x="1850" y="1165" text-anchor="end" class="footer">Updated 2026-09-07</text>
</svg>
