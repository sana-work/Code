<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">Octobot full Asset Services and Transaction Management target architecture</title>
  <desc id="desc">Target architecture with active Asset Services and Transaction Management specialist paths, two Asset Services tools, three Transaction Management tools, a shared runtime, and a provider API.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="as-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="tm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .page-title { font: 700 36px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .lane-note { font: 500 15px Inter, "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .card-title { font: 700 20px Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .card-body { font: 400 15px Inter, "Segoe UI", Arial, sans-serif; fill: #334155; }
      .card-small { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .mono-small { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .arrow-label { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; fill: #475569; }
      .chip { font: 700 13px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .footer { font: 400 14px Inter, "Segoe UI", Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#f8fafc"/>

  <text x="70" y="64" class="page-title">Octobot Full AS + TM Target Architecture</text>
  <text x="70" y="100" class="subtitle">Root routes to two domain specialists; five explicit MCP tools share one provider-neutral runtime</text>

  <rect x="1325" y="35" width="160" height="36" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="1405" y="58" text-anchor="middle" class="chip" fill="#1d4ed8">AS + TM TARGET</text>
  <rect x="1500" y="35" width="160" height="36" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1580" y="58" text-anchor="middle" class="chip" fill="#166534">5 MCP TOOLS</text>
  <rect x="1675" y="35" width="175" height="36" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1763" y="58" text-anchor="middle" class="chip" fill="#92400e">NO GENERIC TOOL</text>

  <!-- Agent layer -->
  <rect x="60" y="135" width="1800" height="380" rx="8" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="90" y="176" class="lane-title">1. Agent executor path</text>
  <text x="352" y="176" class="lane-note">AS, TM, both-domain, and direct routes</text>

  <rect x="90" y="260" width="170" height="112" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="175" cy="293" r="17" fill="#e2e8f0"/>
  <circle cx="175" cy="288" r="6" fill="#475569"/>
  <path d="M160 309 Q175 297 190 309" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <text x="175" y="341" text-anchor="middle" class="card-title">User</text>
  <text x="175" y="362" text-anchor="middle" class="card-small">Business request</text>

  <rect x="330" y="225" width="300" height="160" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <rect x="330" y="225" width="300" height="9" rx="4" fill="#2563eb"/>
  <text x="480" y="265" text-anchor="middle" class="card-title">Root Orchestrator</text>
  <text x="480" y="293" text-anchor="middle" class="card-body">Routes to AS, TM, or both</text>
  <text x="480" y="317" text-anchor="middle" class="card-body">Preserves identifiers exactly</text>
  <text x="480" y="341" text-anchor="middle" class="card-body">Calls no data tools</text>
  <rect x="399" y="350" width="162" height="27" rx="6" fill="#dbeafe"/>
  <text x="480" y="369" text-anchor="middle" class="mono">root_handoff</text>

  <rect x="720" y="170" width="320" height="145" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
  <rect x="720" y="170" width="320" height="9" rx="4" fill="#0f766e"/>
  <text x="880" y="208" text-anchor="middle" class="card-title">AS Specialist</text>
  <text x="880" y="237" text-anchor="middle" class="card-body">Events, Cash, or both</text>
  <text x="880" y="261" text-anchor="middle" class="card-body">May call only 2 AS tools</text>
  <rect x="790" y="276" width="180" height="27" rx="6" fill="#ccfbf1"/>
  <text x="880" y="295" text-anchor="middle" class="chip" fill="#115e59">AS STRUCTURED RESULT</text>

  <rect x="720" y="340" width="320" height="145" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="3" filter="url(#shadow)"/>
  <rect x="720" y="340" width="320" height="9" rx="4" fill="#b45309"/>
  <text x="880" y="378" text-anchor="middle" class="card-title">TM Specialist</text>
  <text x="880" y="407" text-anchor="middle" class="card-body">EOD, current, or settlement details</text>
  <text x="880" y="431" text-anchor="middle" class="card-body">May call only 3 TM tools</text>
  <rect x="790" y="446" width="180" height="27" rx="6" fill="#fef3c7"/>
  <text x="880" y="465" text-anchor="middle" class="chip" fill="#92400e">TM STRUCTURED RESULT</text>

  <rect x="1170" y="240" width="320" height="175" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1170" y="240" width="320" height="9" rx="4" fill="#c2410c"/>
  <text x="1330" y="280" text-anchor="middle" class="card-title">Final Formatter</text>
  <text x="1330" y="308" text-anchor="middle" class="card-body">Receives one or both domain results</text>
  <text x="1330" y="332" text-anchor="middle" class="card-body">Keeps domain tables separate</text>
  <text x="1330" y="356" text-anchor="middle" class="card-body">HTML-free output; partial data retained</text>
  <rect x="1278" y="375" width="104" height="27" rx="6" fill="#ffedd5"/>
  <text x="1330" y="394" text-anchor="middle" class="mono">schema</text>

  <rect x="1605" y="265" width="215" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1713" y="312" text-anchor="middle" class="card-title">UI</text>
  <text x="1713" y="344" text-anchor="middle" class="card-small">Plain text + tables</text>

  <line x1="260" y1="316" x2="319" y2="316" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M630 275 L675 275 L675 242 L710 242" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#as-arrow)"/>
  <text x="670" y="260" text-anchor="end" class="arrow-label" fill="#0f766e">AS route</text>
  <path d="M630 335 L675 335 L675 412 L710 412" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#tm-arrow)"/>
  <text x="666" y="397" text-anchor="end" class="arrow-label" fill="#b45309">TM route</text>

  <path d="M1040 242 L1100 242 L1100 285 L1160 285" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#as-arrow)"/>
  <path d="M1040 412 L1100 412 L1100 370 L1160 370" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#tm-arrow)"/>
  <line x1="1490" y1="326" x2="1594" y2="326" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Specialist-to-tool paths -->
  <path d="M720 207 L650 207 L650 585 L315 585 L315 615" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#as-arrow)"/>
  <text x="480" y="575" text-anchor="middle" class="arrow-label" fill="#0f766e">typed AS calls</text>
  <path d="M880 485 L880 615" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#tm-arrow)"/>
  <text x="895" y="565" class="arrow-label" fill="#b45309">typed TM calls</text>

  <!-- MCP layer -->
  <rect x="60" y="540" width="1800" height="500" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="90" y="580" class="lane-title">2. Five-tool MCP server</text>
  <text x="356" y="580" class="lane-note">Explicit schemas per service; shared implementation beneath the wrappers</text>

  <rect x="90" y="625" width="450" height="270" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="3" filter="url(#shadow)"/>
  <text x="315" y="663" text-anchor="middle" class="card-title">Asset Services tools</text>
  <text x="315" y="699" text-anchor="middle" class="mono">query_as_events_entitlements</text>
  <text x="315" y="731" text-anchor="middle" class="mono">query_as_cash_entitlements</text>
  <line x1="130" y1="755" x2="500" y2="755" stroke="#d1fae5" stroke-width="2"/>
  <text x="315" y="786" text-anchor="middle" class="card-body">2 code-defined ServiceToolContracts</text>
  <text x="315" y="812" text-anchor="middle" class="mono">contracts/asset_services.py</text>
  <rect x="205" y="842" width="220" height="31" rx="6" fill="#ccfbf1"/>
  <text x="315" y="863" text-anchor="middle" class="chip" fill="#115e59">ACTIVE AS DOMAIN</text>

  <rect x="570" y="625" width="600" height="270" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="3" filter="url(#shadow)"/>
  <text x="870" y="663" text-anchor="middle" class="card-title">Transaction Management tools</text>
  <text x="870" y="698" text-anchor="middle" class="mono">query_tm_eod_transactions</text>
  <text x="870" y="730" text-anchor="middle" class="mono">query_tm_current_transactions</text>
  <text x="870" y="762" text-anchor="middle" class="mono">query_tm_settlement_instructions</text>
  <line x1="610" y1="801" x2="1130" y2="801" stroke="#fde68a" stroke-width="2"/>
  <text x="870" y="827" text-anchor="middle" class="card-body">3 code-defined ServiceToolContracts</text>
  <rect x="750" y="842" width="240" height="31" rx="6" fill="#fef3c7"/>
  <text x="870" y="863" text-anchor="middle" class="chip" fill="#92400e">ACTIVE TM DOMAIN</text>

  <rect x="1210" y="625" width="290" height="270" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="1355" y="663" text-anchor="middle" class="card-title">Shared runtime</text>
  <text x="1355" y="694" text-anchor="middle" class="mono">execute_service_tool</text>
  <text x="1355" y="731" text-anchor="middle" class="card-body">Validate typed inputs</text>
  <text x="1355" y="757" text-anchor="middle" class="card-body">Resolve output allowlists</text>
  <text x="1355" y="783" text-anchor="middle" class="card-body">Build equality filters</text>
  <text x="1355" y="809" text-anchor="middle" class="card-body">Business/provider mapping</text>
  <text x="1355" y="835" text-anchor="middle" class="card-body">Normalize records and errors</text>
  <rect x="1252" y="850" width="206" height="30" rx="6" fill="#ede9fe"/>
  <text x="1355" y="871" text-anchor="middle" class="chip" fill="#5b21b6">SHARED BY ALL 5</text>

  <rect x="1540" y="625" width="290" height="170" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="3" filter="url(#shadow)"/>
  <text x="1685" y="662" text-anchor="middle" class="card-title">Provider query service</text>
  <text x="1685" y="691" text-anchor="middle" class="mono">ProviderQueryService</text>
  <text x="1685" y="725" text-anchor="middle" class="card-small">ProviderQueryRequest</text>
  <text x="1685" y="748" text-anchor="middle" class="card-small">FilterExpression</text>
  <text x="1685" y="771" text-anchor="middle" class="card-small">Deadline, retry, auth, TLS</text>

  <rect x="1540" y="825" width="290" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <text x="1685" y="856" text-anchor="middle" class="card-title">Provider REST API</text>
  <text x="1685" y="880" text-anchor="middle" class="card-small">External service boundary</text>

  <path d="M540 760 L555 760 L555 912 L1355 912 L1355 905" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#as-arrow)"/>
  <text x="905" y="929" text-anchor="middle" class="arrow-label" fill="#0f766e">AS contract + validated arguments</text>
  <line x1="1170" y1="760" x2="1200" y2="760" stroke="#b45309" stroke-width="3" marker-end="url(#tm-arrow)"/>
  <text x="1185" y="743" text-anchor="middle" class="arrow-label" fill="#b45309">TM</text>
  <line x1="1500" y1="710" x2="1530" y2="710" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1685 795 L1685 815" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="90" y="950" width="1740" height="65" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="960" y="978" text-anchor="middle" class="mono">Shared cross-cutting controls</text>
  <text x="960" y="1002" text-anchor="middle" class="card-small">RequestContext | typed environment config | auth/TLS | total deadline | bounded retries | log redaction</text>

  <!-- Guarantees -->
  <rect x="60" y="1070" width="1800" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="1103" class="lane-title">Target guarantees</text>
  <text x="330" y="1103" class="card-body">5 explicit tools</text>
  <text x="490" y="1103" class="card-body">No raw provider fields</text>
  <text x="700" y="1103" class="card-body">No generic tool</text>
  <text x="865" y="1103" class="card-body">No cross-domain record join</text>
  <text x="1115" y="1103" class="card-body">Safe errors and partial success</text>
  <text x="1395" y="1103" class="card-body">HTML-free final schema</text>
  <text x="1645" y="1103" class="card-body">Plain-text UI</text>

  <line x1="70" y1="1180" x2="105" y2="1180" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="120" y="1185" class="footer">Active target flow</text>
  <text x="1850" y="1185" text-anchor="end" class="footer">Prepared 2026-09-07</text>
</svg>
